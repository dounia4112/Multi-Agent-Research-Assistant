<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0a08;
    --surface:   #111110;
    --border:    #1e1e1c;
    /* --border2:   #2a2a28; */
    --border2:   #5b5b51;
    --text:      #e8e6e0;
    /* --muted:     #6b6960; */
    --muted:     #9a9787;
    --accent:    #c8b87a;
    --accent2:   #7a9e8a;
    --danger:    #c47a6a;
    --mono:      'JetBrains Mono', monospace;
    --serif:     'Playfair Display', Georgia, serif;
    --sans:      'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 15px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Layout ── */
  .shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
  }

  .logo {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
    50%       { opacity: 0.5; box-shadow: 0 0 3px var(--accent); }
  }

  .header-meta {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border: 1px solid var(--border2);
    border-radius: 20px;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.3s;
  }
  .status-pill.active {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .status-pill.active .pill-dot { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .pill-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border2);
    transition: all 0.3s;
  }

  /* ── Sidebar ── */
  aside {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .sidebar-section {
    padding: 0 20px;
    margin-bottom: 28px;
  }

  .sidebar-label {
    font-family: var(--mono);
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* Agent pipeline */
  .agent-list { display: flex; flex-direction: column; gap: 4px; }

  .agent-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid transparent;
    transition: all 0.25s ease;
    cursor: default;
    position: relative;
    overflow: hidden;
  }

  .agent-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.3s ease;
    transform-origin: bottom;
  }

  .agent-item.running {
    background: rgba(200,184,122,0.04);
    border-color: rgba(200,184,122,0.15);
  }
  .agent-item.running::before { transform: scaleY(1); }

  .agent-item.done {
    background: rgba(122,158,138,0.05);
    border-color: rgba(122,158,138,0.15);
  }
  .agent-item.done::before {
    background: var(--accent2);
    transform: scaleY(1);
  }

  .agent-idx {
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--muted);
    width: 14px;
    text-align: center;
    flex-shrink: 0;
  }

  .agent-info { flex: 1; min-width: 0; }

  .agent-name {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    transition: color 0.25s;
    letter-spacing: 0.02em;
  }
  .agent-item.running .agent-name { color: var(--accent); }
  .agent-item.done    .agent-name { color: var(--accent2); }

  .agent-msg {
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .agent-item.running .agent-msg,
  .agent-item.done    .agent-msg { opacity: 1; }

  .agent-check {
    font-size: 0.65rem;
    color: var(--accent2);
    opacity: 0;
    transition: opacity 0.3s;
    flex-shrink: 0;
  }
  .agent-item.done .agent-check { opacity: 1; }

  /* running spinner */
  .spinner {
    width: 10px; height: 10px;
    border: 1.5px solid rgba(200,184,122,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
    display: none;
  }
  .agent-item.running .spinner { display: block; }
  .agent-item.done    .spinner { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* progress bar */
  .progress-wrap {
    padding: 0 20px;
    margin-bottom: 24px;
  }
  .progress-track {
    height: 1px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 1px;
    width: 0%;
    transition: width 0.6s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--muted);
  }

  /* facts list */
  .facts-list { display: flex; flex-direction: column; gap: 6px; }
  .fact-item {
    display: flex;
    gap: 8px;
    font-size: 0.7rem;
    color: var(--muted);
    line-height: 1.5;
    animation: fadeSlide 0.3s ease both;
  }
  .fact-num {
    font-family: var(--mono);
    font-size: 0.58rem;
    color: var(--border2);
    flex-shrink: 0;
    margin-top: 2px;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Main content ── */
  main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Input area */
  .input-area {
    padding: 28px 36px 24px;
    border-bottom: 1px solid var(--border);
  }

  .query-label {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .query-wrap {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 0;
    border: 1px solid var(--border2);
    border-radius: 8px;
    background: var(--surface);
    transition: border-color 0.2s;
  }
  .query-wrap:focus-within { border-color: rgba(200,184,122,0.35); }

  .query-prompt {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    padding: 14px 0 14px 16px;
    flex-shrink: 0;
    user-select: none;
    line-height: 1.6;
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 300;
    padding: 13px 16px;
    resize: none;
    line-height: 1.6;
    min-height: 52px;
    max-height: 160px;
  }
  textarea::placeholder { color: var(--muted); font-style: italic; }

  .run-btn {
    align-self: flex-end;
    margin: 10px 10px 10px 0;
    padding: 7px 18px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .run-btn:hover:not(:disabled) {
    background: #d4c98a;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(200,184,122,0.3);
  }
  .run-btn:disabled {
    background: var(--border2);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* Output area */
  .output-area {
    flex: 1;
    overflow-y: auto;
    padding: 32px 36px;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 320px;
    gap: 16px;
    text-align: center;
    opacity: 0.4;
  }

  .empty-glyph {
    font-family: var(--serif);
    font-size: 4rem;
    font-style: italic;
    color: var(--muted);
    line-height: 1;
    margin-bottom: 4px;
  }

  .empty-title {
    font-family: var(--serif);
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 400;
  }

  .empty-sub {
    font-size: 0.75rem;
    color: var(--muted);
    max-width: 280px;
    line-height: 1.7;
  }

  /* Report */
  .report-wrap { animation: fadeSlide 0.5s ease; }

  .report-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .report-meta-item {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .report-meta-val {
    color: var(--accent2);
    font-weight: 500;
  }

  .report-body h1 {
    font-family: var(--serif);
    font-size: 1.6rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .report-body h2 {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    margin: 28px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .report-body p {
    font-size: 0.875rem;
    color: #c0bdb6;
    line-height: 1.85;
    margin-bottom: 12px;
    font-weight: 300;
  }
  .report-body li {
    font-size: 0.875rem;
    color: #c0bdb6;
    line-height: 1.75;
    margin-bottom: 6px;
    font-weight: 300;
    padding-left: 4px;
  }
  .report-body ul { list-style: none; margin: 0 0 12px 0; padding: 0; }
  .report-body ul li::before {
    content: '—';
    color: var(--accent);
    margin-right: 10px;
    font-family: var(--mono);
    font-size: 0.7rem;
  }

  /* Log stream */
  .log-stream {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    line-height: 2;
    margin-bottom: 24px;
  }
  .log-line {
    display: flex;
    gap: 12px;
    animation: fadeSlide 0.25s ease both;
  }
  .log-time { color: var(--border2); flex-shrink: 0; }
  .log-agent { color: var(--accent); width: 90px; flex-shrink: 0; }
  .log-msg { color: var(--muted); }
  .log-line.done .log-agent { color: var(--accent2); }

  /* Error */
  .error-box {
    padding: 12px 16px;
    border: 1px solid rgba(196,122,106,0.3);
    background: rgba(196,122,106,0.05);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--danger);
    line-height: 1.6;
    margin-bottom: 20px;
    animation: fadeSlide 0.3s ease;
  }

  /* Cursor blink */
  .cursor {
    display: inline-block;
    width: 7px; height: 13px;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Copy button */
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    padding: 6px 14px;
    border: 1px solid var(--border2);
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }
</style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      Research Assistant
    </div>
    <div class="header-meta">
      <span>LangGraph · Groq · Tavily</span>
      <div class="status-pill" id="statusPill">
        <div class="pill-dot"></div>
        <span id="statusText">Idle</span>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside>
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label">
        <span>Pipeline</span>
        <span id="progressPct">0%</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Agents</div>
      <div class="agent-list" id="agentList">
        <!-- injected by JS -->
      </div>
    </div>

    <div class="sidebar-section" id="factsSection" style="display:none">
      <div class="sidebar-label">Extracted facts</div>
      <div class="facts-list" id="factsList"></div>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <div class="input-area">
      <div class="query-label">Research query</div>
      <div class="query-wrap">
        <span class="query-prompt">›</span>
        <textarea
          id="queryInput"
          rows="2"
          placeholder="What do you want to research? e.g. Impact of LLMs on software engineering jobs in 2025"
          onkeydown="handleKey(event)"
        ></textarea>
        <button class="run-btn" id="runBtn" onclick="runResearch()">Run ⏎</button>
      </div>
    </div>

    <div class="output-area" id="outputArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-glyph">∂</div>
        <div class="empty-title">Nothing yet</div>
        <div class="empty-sub">Enter a research question above and the agents will get to work.</div>
      </div>
    </div>
  </main>
</div>

<script>
  const API = 'https://multi-agent-research-assistant-7biy.onrender.com/';

  const AGENTS = [
    { key: 'planner',      label: 'Planner',      sub: 'Query decomposition' },
    { key: 'web_searcher', label: 'Web Searcher',  sub: 'Tavily search'       },
    { key: 'synthesizer',  label: 'Synthesizer',   sub: 'Fact extraction'     },
    { key: 'writer',       label: 'Writer',        sub: 'Report drafting'     },
    { key: 'grader',       label: 'Grader',        sub: 'Quality review'      },
  ];

  // Build sidebar agent rows
  const agentList = document.getElementById('agentList');
  AGENTS.forEach((a, i) => {
    agentList.innerHTML += `
      <div class="agent-item" id="agent-${a.key}">
        <span class="agent-idx">${String(i+1).padStart(2,'0')}</span>
        <div class="agent-info">
          <div class="agent-name">${a.label}</div>
          <div class="agent-msg" id="msg-${a.key}">${a.sub}</div>
        </div>
        <div class="spinner"></div>
        <div class="agent-check">✓</div>
      </div>`;
  });

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runResearch(); }
  }

  function setStatus(text, active = false) {
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusPill').className = 'status-pill' + (active ? ' active' : '');
  }

  function setAgentState(key, state, msg = '') {
    const el = document.getElementById(`agent-${key}`);
    const msgEl = document.getElementById(`msg-${key}`);
    if (!el) return;
    el.className = `agent-item ${state}`;
    if (msg) msgEl.textContent = msg;
    // update progress
    const done = document.querySelectorAll('.agent-item.done').length;
    const pct  = Math.round((done / AGENTS.length) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent  = pct + '%';
  }

  function resetAgents() {
    AGENTS.forEach(a => setAgentState(a.key, '', a.sub));
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressPct').textContent  = '0%';
    document.getElementById('factsSection').style.display = 'none';
    document.getElementById('factsList').innerHTML = '';
    document.getElementById('progressWrap').style.display = 'block';
  }

  function addLog(agent, msg, done = false) {
    const log = document.getElementById('logStream');
    if (!log) return;
    const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const cls = done ? 'log-line done' : 'log-line';
    log.innerHTML += `
      <div class="${cls}">
        <span class="log-time">${now}</span>
        <span class="log-agent">[${agent}]</span>
        <span class="log-msg">${msg}</span>
      </div>`;
    log.scrollTop = log.scrollHeight;
  }

  function showFact(fact, index) {
    const list = document.getElementById('factsList');
    const delay = index * 0.05;
    list.innerHTML += `
      <div class="fact-item" style="animation-delay:${delay}s">
        <span class="fact-num">${String(index+1).padStart(2,'0')}</span>
        <span>${fact}</span>
      </div>`;
    document.getElementById('factsSection').style.display = 'block';
  }

  function renderReport(data) {
    const output = document.getElementById('outputArea');
    const lines  = (data.draft || '').split('\n');
    let html = '';
    for (const line of lines) {
      if (line.startsWith('## '))      html += `<h2>${line.slice(3)}</h2>`;
      else if (line.startsWith('# '))  html += `<h1>${line.slice(2)}</h1>`;
      else if (line.startsWith('* ') || line.startsWith('- ')) html += `<ul><li>${line.slice(2)}</li></ul>`;
      else if (line.trim() === '')     html += '';
      else                             html += `<p>${line}</p>`;
    }

    output.innerHTML = `
      <div class="report-wrap">
        <div class="report-meta">
          <div class="report-meta-item">Facts <span class="report-meta-val">${data.facts?.length ?? '—'}</span></div>
          <div class="report-meta-item">Revisions <span class="report-meta-val">${data.revision ?? '—'}</span></div>
          <div class="report-meta-item">Grade <span class="report-meta-val">${data.grade ?? '—'}</span></div>
          <div class="report-meta-item">Query <span class="report-meta-val" style="font-style:italic;text-transform:none;letter-spacing:0">${document.getElementById('queryInput').value}</span></div>
        </div>
        <div class="report-body">${html}</div>
        <button class="copy-btn" onclick="copyReport()">⎘ Copy report</button>
      </div>`;
  }

  function copyReport() {
    const text = document.querySelector('.report-body')?.innerText || '';
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ Copied';
      setTimeout(() => btn.innerHTML = '⎘ Copy report', 2000);
    });
  }

  async function runResearch() {
    const query = document.getElementById('queryInput').value.trim();
    if (!query) return;

    const runBtn = document.getElementById('runBtn');
    runBtn.disabled = true;
    setStatus('Running', true);
    resetAgents();

    // Show log area
    document.getElementById('emptyState') && (document.getElementById('emptyState').style.display = 'none');
    const output = document.getElementById('outputArea');
    output.innerHTML = `<div class="log-stream" id="logStream"></div>`;

    // Mark first agent running
    setAgentState('planner', 'running');
    addLog('system', `Research started — "${query}"`);

    try {
      const response = await fetch(`${API}/research/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      if (!response.ok) throw new Error(`Server responded with ${response.status}`);

      const reader  = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }

          const { agent, message, payload } = data;

          if (agent === 'done') {
            // fetch final and render
            setStatus('Fetching report...', true);
            const final = await fetch(`${API}/research`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query }),
            }).then(r => r.json());
            renderReport(final);
            setStatus('Done', false);
            runBtn.disabled = false;
            return;
          }

          if (AGENTS.find(a => a.key === agent)) {
            setAgentState(agent, 'done', message);
            addLog(agent, message, true);
            const idx = AGENTS.findIndex(a => a.key === agent);
            if (idx < AGENTS.length - 1) setAgentState(AGENTS[idx+1].key, 'running');
          }

          if (agent === 'synthesizer' && Array.isArray(payload) && payload.length) {
            payload.forEach((f, i) => showFact(f, i));
          }
        }
      }
    } catch (e) {
      const msg = e.message.includes('fetch') || e.message.includes('connect') || e.message.includes('Failed')
        ? 'Cannot reach the API. Make sure <code>uvicorn main:app --reload</code> is running on port 8000.'
        : e.message;
      output.innerHTML = `<div class="error-box">⚠ ${msg}</div>`;
      setStatus('Error', false);
      runBtn.disabled = false;
    }
  }
</script>
</body>
</html>
